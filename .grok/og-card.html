<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #070c0d;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#163632"/>
      <stop offset="42%" stop-color="#0e221f"/>
      <stop offset="100%" stop-color="#070c0d"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fffd"/>
      <stop offset="48%" stop-color="#e6f3f1"/>
      <stop offset="100%" stop-color="#c5e0db"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fffd"/>
      <stop offset="52%" stop-color="#e6f3f1"/>
      <stop offset="100%" stop-color="#d2e8e4"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12a399"/>
      <stop offset="100%" stop-color="#0a6d66"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c2421"/>
      <stop offset="48%" stop-color="#1a3d38"/>
      <stop offset="100%" stop-color="#0c2421"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="36" y="28" width="1128" height="574" fill="none" stroke="#e6f3f1" stroke-opacity="0.16" stroke-width="1"/>
  <rect x="44" y="36" width="1112" height="558" fill="none" stroke="#0d8c82" stroke-opacity="0.45" stroke-width="1"/>

  <ellipse cx="600" cy="568" rx="360" ry="16" fill="#000000" opacity="0.38"/>

  <!-- covers -->
  <path fill="url(#cover)" d="M156 332 L552 360 L552 548 L156 522 Z"/>
  <path fill="url(#cover)" d="M648 360 L1044 332 L1044 522 L648 548 Z"/>

  <!-- pages -->
  <path fill="url(#pageL)" d="M178 338 Q372 314 540 356 L540 528 Q372 554 178 514 Z"/>
  <path fill="url(#pageR)" d="M660 356 Q828 314 1022 338 L1022 514 Q828 554 660 528 Z"/>

  <!-- glass highlights -->
  <path fill="#ffffff" opacity="0.55" d="M178 338 Q372 314 540 356 L540 392 Q372 358 186 372 Z"/>
  <path fill="#ffffff" opacity="0.42" d="M660 356 Q828 314 1022 338 L1014 372 Q828 358 660 392 Z"/>

  <!-- quiet staff rules, not lettering -->
  <g fill="none" stroke="#0d8c82" stroke-opacity="0.32" stroke-width="1.4" stroke-linecap="round">
    <path d="M230 408 H470"/>
    <path d="M246 438 H470"/>
    <path d="M230 468 H454"/>
    <path d="M730 408 H970"/>
    <path d="M730 438 H954"/>
    <path d="M746 468 H970"/>
  </g>

  <!-- spine -->
  <path fill="url(#spine)" d="M540 352 H660 V532 H540 Z"/>
  <path stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.25" d="M600 364 V520"/>

  <!-- ribbon -->
  <path fill="#0d8c82" d="M590 528 H614 L618 592 L602 576 L586 592 Z"/>
  <path fill="#ffffff" opacity="0.35" d="M594 528 H602 L604 574 L596 566 Z"/>

  <!-- cross -->
  <g fill="#0d8c82" transform="translate(600 78)">
    <rect x="-1.35" y="-16" width="2.7" height="32" rx="0.6"/>
    <rect x="-11" y="-1.35" width="22" height="2.7" rx="0.6"/>
  </g>

  <text x="600" y="148" text-anchor="middle"
    font-family="Liberation Serif, FreeSerif, serif"
    font-size="36" letter-spacing="9" fill="#e6f3f1">Nyimbo za</text>
  <text x="600" y="252" text-anchor="middle"
    font-family="Liberation Serif, FreeSerif, serif"
    font-size="108" fill="#f7fffd">Wokovu</text>
  <path d="M492 276 H708" stroke="#0d8c82" stroke-width="1.5"/>
</svg>
</body>
</html>
